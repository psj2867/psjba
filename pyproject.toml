[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "psjba"
version = "0.1.0"
description = "PSJBA — Browser Agent"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "playwright>=1.40",
    "cryptography>=41.0",
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "aiocron>=1.5",
    "qasync>=0.27",
    "typing_extensions>=4.8",
]

[tool.shiv]
entry_point = "main:main"

[tool.pytest.ini_options]
markers = [
    "openrouter: OpenRouter API 호출이 필요한 테스트 (네트워크 필요)",
]